service: tracegraph-api

# Hard-pinned to Serverless Framework v3 — v4 requires a commercial license
# key and refuses to run ("Forbidden") without one. v4 also enforces this
# range, so a stray `npx serverless` can never execute against this config.
# Installed locally as a devDependency (serverless@^3).
frameworkVersion: '>=3.0.0 <4.0.0'
useDotenv: true

provider:
  name: aws
  # Node 24 LTS (EOL April 2028) — current AWS-recommended runtime.
  # Note: Serverless v3's schema only knows runtimes up to nodejs20.x, so it
  # warns "Invalid configuration" here — cosmetic, non-blocking (same as
  # nodejs22.x before). CloudFormation/Lambda accepts nodejs24.x fine.
  runtime: nodejs24.x
  region: ${opt:region, 'ap-south-1'}
  memorySize: 1024
  timeout: 30
  environment:
    NODE_ENV: production
    PORT: 4000
    CORS_ORIGIN: ${env:CORS_ORIGIN, 'http://localhost:3000'}
    COGNODB_URI: ${env:COGNODB_URI}
    COGNODB_USERNAME: ${env:COGNODB_USERNAME, 'cognodb'}
    COGNODB_PASSWORD: ${env:COGNODB_PASSWORD}
    GITHUB_CLIENT_ID: ${env:GITHUB_CLIENT_ID, ''}
    GITHUB_CLIENT_SECRET: ${env:GITHUB_CLIENT_SECRET, ''}
    GITHUB_OAUTH_REDIRECT_URI: ${env:GITHUB_OAUTH_REDIRECT_URI, ''}
    SESSION_SECRET: ${env:SESSION_SECRET, ''}
    SESSION_TTL_DAYS: 7
    WEB_APP_URL: ${env:WEB_APP_URL, 'http://localhost:3000'}
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    AI_ENABLED: ${env:AI_ENABLED, 'true'}
    AI_PROVIDER: ${env:AI_PROVIDER, 'groq'}
    AI_MODEL: ${env:AI_MODEL, 'llama-3.3-70b-versatile'}
    LOG_LEVEL: info

# The artifact is a single self-contained bundle (bundle/lambda.js) built by
# `npm run build:lambda` — it inlines every runtime dependency, so no
# node_modules or dist/ files are packaged. `scripts/verify-lambda-package.js`
# fails the deploy if the zip is missing the bundle or carrying node_modules.
package:
  individually: false
  patterns:
    - 'bundle/**'
    - '!node_modules/**'
    - '!dist/**'
    - '!src/**'
    - '!scripts/**'
    - '!test/**'

functions:
  api:
    handler: bundle/lambda.handler
    events:
      - httpApi:
          path: '/{proxy+}'
          method: ANY
      - httpApi:
          path: '/'
          method: ANY
